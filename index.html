<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kindle & PC 独立双端阅读成就看板</title>
  <style>
    /* ==========================================================================
       1. 6寸 Kindle 墨水屏超强兼容与高对比度样式 (ES5/E-Ink Optimized)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      line-height: 1.4;
      padding: 8px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      border-bottom: 3px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .clock-badge {
      border: 2px solid #000000;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: bold;
      background: #ffffff;
    }

    .card {
      border: 2px solid #000000;
      padding: 10px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .card-title {
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px dashed #000000;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    select, input[type="text"] {
      width: 100%;
      height: 48px;
      border: 2px solid #000000;
      padding: 0 10px;
      font-size: 16px;
      background: #ffffff;
      color: #000000;
      outline: none;
      border-radius: 0;
      margin-bottom: 8px;
      -webkit-appearance: none;
    }

    .btn {
      display: block;
      width: 100%;
      height: 52px;
      line-height: 48px;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
      text-decoration: none;
    }

    .btn:active, .btn.active {
      background: #000000;
      color: #ffffff;
    }

    .btn-solid {
      background: #000000;
      color: #ffffff;
    }

    .btn-solid:active {
      background: #ffffff;
      color: #000000;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-group .btn {
      flex: 1;
    }

    .timer-box {
      text-align: center;
      padding: 10px 0;
    }

    .timer-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .timer-val {
      font-size: 48px;
      font-weight: 900;
      font-family: Courier, monospace, sans-serif;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .stat-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat-card {
      flex: 1;
      border: 2px solid #000000;
      padding: 8px;
      text-align: center;
    }

    .stat-n {
      font-size: 20px;
      font-weight: 900;
    }

    .stat-l {
      font-size: 11px;
      font-weight: bold;
    }

    .book-line {
      border-bottom: 1px solid #000000;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .sm-btn {
      border: 1.5px solid #000000;
      background: #ffffff;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .sm-btn:active {
      background: #000000;
      color: #ffffff;
    }

    .hidden { display: none !important; }

    /* PC 端高级大屏样式 */
    .pc-mode-container {
      background: #f4f6f8;
      padding: 20px;
      min-height: 100vh;
      color: #1f2937;
    }

    .pc-card-item {
      background: #ffffff;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .pc-grid-3 {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pc-stat-box {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 6px;
      text-align: center;
    }

    .pc-stat-num {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }

    .pc-stat-label {
      font-size: 12px;
      color: #64748b;
    }

    table.pc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }

    table.pc-table th, table.pc-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    table.pc-table th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    .pc-action-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .pc-action-btn:hover { background: #1d4ed8; }
    .pc-btn-red { background: #ef4444; }
    .pc-btn-red:hover { background: #dc2626; }
  </style>
</head>
<body>

  <!-- ==========================================================================
       A. KINDLE 6寸屏极简视图
       ========================================================================== -->
  <div id="kindle-ui">
    <header>
      <h1>📖 Kindle 阅读计时器</h1>
      <span class="clock-badge" id="k-clock">00:00</span>
    </header>

    <!-- 图书选择卡片 -->
    <div class="card">
      <div class="card-title">① 选择当前阅读图书</div>
      <select id="k-select" onchange="onSelectChange(this.value)">
        <option value="">-- 请选择图书 --</option>
      </select>

      <div id="k-add-form" class="hidden">
        <input type="text" id="k-input-title" placeholder="输入书名，如《三体》">
        <div class="btn-group">
          <button class="btn btn-solid" onclick="doAddBook()">确认添加</button>
          <button class="btn" onclick="toggleAddForm(false)">取消</button>
        </div>
      </div>
      <button id="k-btn-show-add" class="btn" onclick="toggleAddForm(true)">➕ 添加新书</button>
    </div>

    <!-- 计时面板卡片 -->
    <div class="card">
      <div class="card-title">② 正在阅读 (退出网页看书不影响计时间)</div>
      <div class="timer-box">
        <div class="timer-name" id="k-book-title-display">未选择图书</div>
        <div class="timer-val" id="k-timer-display">00:00:00</div>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn btn-solid" onclick="doStart()">▶ 开始阅读</button>
        <button id="btn-pause" class="btn hidden" onclick="doPause()">⏸ 暂停</button>
      </div>
      <button id="btn-finish" class="btn hidden" onclick="doFinish()" style="margin-top: 6px;">⏹ 完成并保存本次阅读</button>
    </div>

    <!-- 云同步状态卡片 -->
    <div class="card">
      <div class="card-title">☁ 云端实时同步</div>
      <div style="font-size: 12px; margin-bottom: 6px;" id="k-sync-status-text">状态：未绑定 GitHub Gist 云同步</div>
      <div class="btn-group">
        <button class="btn btn-solid" style="height: 42px; line-height: 38px; font-size: 14px;" onclick="manualPushCloud()">☁ 立即上传数据到云端</button>
        <button class="btn" style="height: 42px; line-height: 38px; font-size: 14px;" onclick="openSyncPrompt()">⚙ 设置密钥</button>
      </div>
    </div>

    <!-- 成就看板卡片 -->
    <div class="card">
      <div class="card-title">🏆 累计成就与单本明细</div>
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-l">总阅读时长</div>
          <div class="stat-n" id="k-stat-total">0分</div>
        </div>
        <div class="stat-card">
          <div class="stat-l">累计图书</div>
          <div class="stat-n" id="k-stat-count">0本</div>
        </div>
      </div>
      <div id="k-list-box"></div>
    </div>

    <div style="text-align: center; margin-top: 15px; font-size: 12px; padding-bottom: 20px;">
      <a href="javascript:void(0)" onclick="switchToPCMode()" style="color: #000; text-decoration: underline; font-weight: bold;">切换至电脑大屏管理模式 ↗</a>
    </div>
  </div>

  <!-- ==========================================================================
       B. 电脑端大屏管理视图 (PC Dashboard Mode)
       ========================================================================== -->
  <div id="pc-ui" class="pc-mode-container hidden">
    <div class="pc-card-item">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h2 style="font-size: 20px; font-weight: 800;">📊 个人阅读统计与成就大屏 (PC 管理端)</h2>
          <p style="font-size: 13px; color: #64748b; margin-top: 2px;">与 Kindle 墨水屏数据共享 | 历史记录修改与 CSV 导出</p>
        </div>
        <div>
          <button class="pc-action-btn" onclick="fetchCloudData(true)">🔄 手动拉取云端新数据</button>
          <button class="pc-action-btn" style="background:#10b981; margin-left:6px;" onclick="openSyncPrompt()">⚙ 配置 GitHub Gist 云同步</button>
          <button class="pc-action-btn" style="background:#64748b; margin-left:6px;" onclick="exportCSVData()">📥 导出 CSV 报表</button>
          <button class="pc-action-btn" style="background:#475569; margin-left:6px;" onclick="switchToKindleMode()">📱 切换回 Kindle 极简视图</button>
        </div>
      </div>
    </div>

    <div class="pc-grid-3">
      <div class="pc-stat-box">
        <div class="pc-stat-label">累计阅读总时长</div>
        <div class="pc-stat-num" id="pc-stat-time">0 小时</div>
      </div>
      <div class="pc-stat-box">
        <div class="pc-stat-label">已读完图书数量</div>
        <div class="pc-stat-num" id="pc-stat-completed">0 本</div>
      </div>
      <div class="pc-stat-box">
        <div class="pc-stat-label">总打卡记录次数</div>
        <div class="pc-stat-num" id="pc-stat-sessions">0 次</div>
      </div>
    </div>

    <div class="pc-card-item">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
        <strong style="font-size:15px;">📝 历史阅读明细记录</strong>
        <button class="pc-action-btn" onclick="doManualAddSession()">➕ 手动补录一次阅读</button>
      </div>
      <table class="pc-table">
        <thead>
          <tr>
            <th>打卡时间</th>
            <th>图书名称</th>
            <th>本次时长</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="pc-history-tbody">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8;">暂无历史记录</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pc-card-item">
      <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 10px;">📚 全部图书管理列表</h3>
      <div id="pc-list-box"></div>
    </div>
  </div>

  <!-- ES5 纯原生 JavaScript 脚本 (100% 兼容老版本 Kindle WebKit 引擎) -->
  <script>
    var state = {
      books: [],
      sessions: [],
      activeId: null,
      gistToken: '',
      gistId: ''
    };

    var timer = {
      running: false,
      paused: false,
      startTime: 0,
      elapsedSec: 0,
      intervalId: null
    };

    window.onload = function() {
      loadData();
      startClock();
      
      if (window.location.href.indexOf('mode=pc') !== -1) {
        switchToPCMode();
      } else {
        switchToKindleMode();
      }
      render();

      if (state.gistToken && state.gistId) {
        fetchCloudData(false);
      }
    };

    function startClock() {
      function tick() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var str = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
        var elem = document.getElementById('k-clock');
        if (elem) elem.innerHTML = str;
      }
      tick();
      setInterval(tick, 30000);
    }

    function loadData() {
      try {
        var raw = localStorage.getItem('k_reading_v4');
        if (raw) {
          state = JSON.parse(raw);
        }
      } catch(e) {}
      updateSyncStatusText();
    }

    function saveData() {
      try {
        localStorage.setItem('k_reading_v4', JSON.stringify(state));
      } catch(e) {}
      
      if (state.gistToken && state.gistId) {
        pushCloudData(null);
      }
    }

    function updateSyncStatusText() {
      var elem = document.getElementById('k-sync-status-text');
      if (elem) {
        if (state.gistToken && state.gistId) {
          elem.innerHTML = '状态：<strong style="color:green;">☁ 已关联 GitHub Gist 云同步</strong>';
        } else {
          elem.innerHTML = '状态：未关联 GitHub Gist 云同步';
        }
      }
    }

    function openSyncPrompt() {
      var t = prompt('请输入你的 GitHub Personal Access Token (只需勾选 gist 权限)：', state.gistToken || '');
      if (t === null) return;
      var g = prompt('请输入 GitHub Gist ID (已有填入，留空点击确定将自动为您创建全新 Gist)：', state.gistId || '');
      if (g === null) return;

      state.gistToken = t.replace(/^\s+|\s+$/g, '');
      state.gistId = g.replace(/^\s+|\s+$/g, '');
      saveData();
      updateSyncStatusText();

      if (state.gistToken && !state.gistId) {
        autoCreateGist();
      } else if (state.gistToken && state.gistId) {
        fetchCloudData(true);
      }
    }

    function autoCreateGist() {
      if (!state.gistToken) return;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.github.com/gists', true);
      xhr.setRequestHeader('Authorization', 'token ' + state.gistToken);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 201) {
            var res = JSON.parse(xhr.responseText);
            state.gistId = res.id;
            saveData();
            updateSyncStatusText();
            alert('🎉 成功在云端自动创建专属数据 Gist！Gist ID: ' + res.id);
            pushCloudData(null);
          } else {
            alert('创建云端 Gist 失败，错误状态码: ' + xhr.status);
          }
        }
      };
      var payload = {
        description: 'Kindle Reading Tracker Cloud Sync Data',
        public: false,
        files: {
          'kindle_reading_data.json': {
            content: JSON.stringify({ books: state.books, sessions: state.sessions }, null, 2)
          }
        }
      };
      xhr.send(JSON.stringify(payload));
    }

    // 智能双向合并算法：保障本地新加的书名与数据不会丢失，合并后反向同步上云
    function mergeCloudAndLocal(cloudData) {
      if (!cloudData || !cloudData.books) return;
      var bookMap = {};
      var mergedBooks = [];

      for (var i = 0; i < cloudData.books.length; i++) {
        var cb = cloudData.books[i];
        if (cb.title === '测试书') continue;
        bookMap[cb.id] = cb;
        if (cb.title) bookMap['t_' + cb.title] = cb;
      }

      for (var j = 0; j < state.books.length; j++) {
        var lb = state.books[j];
        if (lb.title === '测试书') continue;
        var existing = bookMap[lb.id] || (lb.title ? bookMap['t_' + lb.title] : null);
        if (existing) {
          existing.totalSec = Math.max(existing.totalSec || 0, lb.totalSec || 0);
          existing.completed = existing.completed || lb.completed;
        } else {
          bookMap[lb.id] = lb;
        }
      }

      for (var key in bookMap) {
        if (key.indexOf('t_') !== 0 && bookMap.hasOwnProperty(key)) {
          mergedBooks.push(bookMap[key]);
        }
      }

      var sessMap = {};
      var mergedSessions = [];
      var allSessions = (cloudData.sessions || []).concat(state.sessions || []);
      for (var k = 0; k < allSessions.length; k++) {
        var s = allSessions[k];
        if (!sessMap[s.id]) {
          sessMap[s.id] = s;
          mergedSessions.push(s);
        }
      }

      state.books = mergedBooks;
      state.sessions = mergedSessions;
      if (!state.activeId && state.books.length > 0) {
        state.activeId = state.books[0].id;
      }
      localStorage.setItem('k_reading_v4', JSON.stringify(state));
      render();

      // 合并完成后，自动将合并后的最新数据反向推送到云端！
      pushCloudData(null);
    }

    function fetchCloudData(showAlert) {
      if (!state.gistToken || !state.gistId) {
        if (showAlert) alert('未检测到绑定的 Token 或 Gist ID，请点击设置！');
        return;
      }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.github.com/gists/' + state.gistId, true);
      xhr.setRequestHeader('Authorization', 'token ' + state.gistToken);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var res = JSON.parse(xhr.responseText);
              if (res.files && res.files['kindle_reading_data.json']) {
                var c = JSON.parse(res.files['kindle_reading_data.json'].content);
                mergeCloudAndLocal(c);
                if (showAlert) alert('🎉 云端数据同步成功！');
              }
            } catch(e) {
              if (showAlert) alert('解析云端数据格式失败');
            }
          } else {
            if (showAlert) alert('拉取云端失败，错误代码: ' + xhr.status);
          }
        }
      };
      xhr.send();
    }

    function manualPushCloud() {
      if (!state.gistToken || !state.gistId) {
        alert('请先点击⚙设置密钥绑定 Token & Gist！');
        return;
      }
      pushCloudData(function(success, msg) {
        alert(msg);
      });
    }

    function pushCloudData(cb) {
      if (!state.gistToken || !state.gistId) return;
      var xhr = new XMLHttpRequest();
      // 使用兼容性最强、跨域最安全的 POST + X-HTTP-Method-Override PATCH
      xhr.open('POST', 'https://api.github.com/gists/' + state.gistId, true);
      xhr.setRequestHeader('X-HTTP-Method-Override', 'PATCH');
      xhr.setRequestHeader('Authorization', 'token ' + state.gistToken);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 201) {
            if (cb) cb(true, '☁ 数据已成功上传同步到云端！');
          } else {
            if (cb) cb(false, '上传到云端失败，错误状态码: ' + xhr.status);
          }
        }
      };
      var payload = {
        files: {
          'kindle_reading_data.json': {
            content: JSON.stringify({ books: state.books, sessions: state.sessions }, null, 2)
          }
        }
      };
      xhr.send(JSON.stringify(payload));
    }

    function render() {
      renderSelect();
      renderStats();
      renderPCDashboard();
    }

    function renderSelect() {
      var select = document.getElementById('k-select');
      if (!select) return;
      var html = '<option value="">-- 请选择图书 --</option>';
      for (var i = 0; i < state.books.length; i++) {
        var b = state.books[i];
        var sel = (b.id === state.activeId) ? ' selected' : '';
        html += '<option value="' + b.id + '"' + sel + '>' + (b.completed ? '✔ ' : '') + escapeStr(b.title) + ' (' + formatMin(b.totalSec) + ')</option>';
      }
      select.innerHTML = html;

      var nameDisplay = document.getElementById('k-book-title-display');
      var activeBook = getActiveBook();
      if (nameDisplay) {
        nameDisplay.innerHTML = activeBook ? '《' + escapeStr(activeBook.title) + '》' : '未选择图书';
      }
    }

    function getActiveBook() {
      if (!state.activeId) return null;
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === state.activeId) return state.books[i];
      }
      return null;
    }

    function onSelectChange(val) {
      state.activeId = val || null;
      saveData();
      render();
    }

    function toggleAddForm(show) {
      var form = document.getElementById('k-add-form');
      var btn = document.getElementById('k-btn-show-add');
      if (show) {
        form.className = '';
        btn.className = 'btn hidden';
      } else {
        form.className = 'hidden';
        btn.className = 'btn';
        document.getElementById('k-input-title').value = '';
      }
    }

    function doAddBook() {
      var input = document.getElementById('k-input-title');
      var title = input.value.replace(/^\s+|\s+$/g, '');
      if (!title) {
        alert('请输入书名');
        return;
      }
      var newBook = {
        id: 'b_' + new Date().getTime(),
        title: title,
        totalSec: 0,
        completed: false
      };
      state.books.push(newBook);
      state.activeId = newBook.id;
      saveData();
      toggleAddForm(false);
      render();
    }

    function doStart() {
      if (!state.activeId) {
        alert('请先选择或新建一本图书');
        return;
      }
      if (timer.running && !timer.paused) return;

      timer.running = true;
      timer.paused = false;
      timer.startTime = new Date().getTime() - (timer.elapsedSec * 1000);

      document.getElementById('btn-start').className = 'btn btn-solid hidden';
      document.getElementById('btn-pause').className = 'btn';
      document.getElementById('btn-finish').className = 'btn';

      clearInterval(timer.intervalId);
      timer.intervalId = setInterval(onTimerTick, 1000);
    }

    function doPause() {
      if (!timer.running) return;
      timer.paused = true;
      clearInterval(timer.intervalId);
      var btnStart = document.getElementById('btn-start');
      btnStart.innerHTML = '▶ 继续阅读';
      btnStart.className = 'btn btn-solid';
      document.getElementById('btn-pause').className = 'btn hidden';
    }

    function onTimerTick() {
      if (!timer.running || timer.paused) return;
      var now = new Date().getTime();
      timer.elapsedSec = Math.floor((now - timer.startTime) / 1000);
      var sec = timer.elapsedSec;
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;

      var hs = h < 10 ? '0' + h : h;
      var ms = m < 10 ? '0' + m : m;
      var ss = s < 10 ? '0' + s : s;

      document.getElementById('k-timer-display').innerHTML = hs + ':' + ms + ':' + ss;
    }

    function doFinish() {
      if (timer.elapsedSec < 5) {
        if (!confirm('阅读不足5秒，取消保存吗？')) return;
        resetTimer();
        return;
      }
      clearInterval(timer.intervalId);
      var book = getActiveBook();
      if (book) {
        book.totalSec += timer.elapsedSec;
        state.sessions.push({
          id: 's_' + new Date().getTime(),
          bookId: book.id,
          sec: timer.elapsedSec,
          time: new Date().getTime()
        });
        saveData();
      }
      alert('🎉 成功记录阅读用时 ' + formatMin(timer.elapsedSec));
      resetTimer();
      render();
    }

    function resetTimer() {
      clearInterval(timer.intervalId);
      timer.running = false;
      timer.paused = false;
      timer.elapsedSec = 0;
      document.getElementById('k-timer-display').innerHTML = '00:00:00';
      var btnStart = document.getElementById('btn-start');
      btnStart.innerHTML = '▶ 开始阅读';
      btnStart.className = 'btn btn-solid';
      document.getElementById('btn-pause').className = 'btn hidden';
      document.getElementById('btn-finish').className = 'btn hidden';
    }

    function renderStats() {
      var totalSec = 0;
      for (var i = 0; i < state.books.length; i++) {
        totalSec += (state.books[i].totalSec || 0);
      }

      document.getElementById('k-stat-total').innerHTML = formatMin(totalSec);
      document.getElementById('k-stat-count').innerHTML = state.books.length + '本';

      var kBox = document.getElementById('k-list-box');
      if (!kBox) return;

      if (state.books.length === 0) {
        kBox.innerHTML = '<div style="font-size:12px; text-align:center; padding:8px;">暂无图书数据</div>';
        return;
      }

      var html = '';
      for (var j = 0; j < state.books.length; j++) {
        var bk = state.books[j];
        html += '<div class="book-line">' +
                  '<div>' + (bk.completed ? '✔ ' : '') + '《' + escapeStr(bk.title) + '》 (<strong>' + formatMin(bk.totalSec) + '</strong>)</div>' +
                  '<div>' +
                    '<button class="sm-btn" onclick="toggleComplete(\'' + bk.id + '\')">' + (bk.completed ? '未完' : '读完') + '</button> ' +
                    '<button class="sm-btn" onclick="deleteBook(\'' + bk.id + '\')">删</button>' +
                  '</div>' +
                '</div>';
      }
      kBox.innerHTML = html;
    }

    function renderPCDashboard() {
      var totalSec = 0;
      var completedCount = 0;
      for (var i = 0; i < state.books.length; i++) {
        totalSec += (state.books[i].totalSec || 0);
        if (state.books[i].completed) completedCount++;
      }

      var timeElem = document.getElementById('pc-stat-time');
      var compElem = document.getElementById('pc-stat-completed');
      var sessElem = document.getElementById('pc-stat-sessions');

      if (timeElem) timeElem.innerHTML = (totalSec / 3600).toFixed(1) + ' 小时';
      if (compElem) compElem.innerHTML = completedCount + ' 本';
      if (sessElem) sessElem.innerHTML = state.sessions.length + ' 次';

      var tbody = document.getElementById('pc-history-tbody');
      if (tbody) {
        if (state.sessions.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">暂无历史记录</td></tr>';
        } else {
          var hHtml = '';
          for (var k = state.sessions.length - 1; k >= 0; k--) {
            var s = state.sessions[k];
            var bTitle = '已删图书';
            for (var m = 0; m < state.books.length; m++) {
              if (state.books[m].id === s.bookId) {
                bTitle = state.books[m].title;
                break;
              }
            }
            hHtml += '<tr>' +
                       '<td>' + new Date(s.time).toLocaleString() + '</td>' +
                       '<td><strong>《' + escapeStr(bTitle) + '》</strong></td>' +
                       '<td>' + formatMin(s.sec) + '</td>' +
                       '<td><button class="pc-action-btn pc-btn-red" style="padding:2px 8px;" onclick="deleteSession(\'' + s.id + '\')">删除</button></td>' +
                     '</tr>';
          }
          tbody.innerHTML = hHtml;
        }
      }

      var pcBox = document.getElementById('pc-list-box');
      if (pcBox) {
        if (state.books.length === 0) {
          pcBox.innerHTML = '<div style="color:#94a3b8; font-size:13px;">暂无图书数据</div>';
        } else {
          var pcHtml = '';
          for (var n = 0; n < state.books.length; n++) {
            var bItem = state.books[n];
            pcHtml += '<div style="border-bottom:1px solid #eee; padding:8px 0; display:flex; justify-content:space-between; align-items:center;">' +
                        '<div><strong>《' + escapeStr(bItem.title) + '》</strong> <span style="font-size:12px; color:#64748b;">(累计 ' + formatMin(bItem.totalSec) + ')</span></div>' +
                        '<div>' +
                          '<button class="pc-action-btn" style="padding:3px 8px;" onclick="toggleComplete(\'' + bItem.id + '\')">' + (bItem.completed ? '取消读完' : '标记读完') + '</button> ' +
                          '<button class="pc-action-btn pc-btn-red" style="padding:3px 8px;" onclick="deleteBook(\'' + bItem.id + '\')">删除图书</button>' +
                        '</div>' +
                      '</div>';
          }
          pcBox.innerHTML = pcHtml;
        }
      }
    }

    function deleteSession(sId) {
      if (!confirm('确定删除这条历史记录吗？')) return;
      var newSessions = [];
      for (var i = 0; i < state.sessions.length; i++) {
        var s = state.sessions[i];
        if (s.id === sId) {
          var book = getBookById(s.bookId);
          if (book) book.totalSec = Math.max(0, book.totalSec - s.sec);
        } else {
          newSessions.push(s);
        }
      }
      state.sessions = newSessions;
      saveData();
      render();
    }

    function getBookById(bId) {
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === bId) return state.books[i];
      }
      return null;
    }

    function doManualAddSession() {
      var title = prompt('请输入要补录的书名：');
      if (!title) return;
      var book = getBookByTitle(title);
      if (!book) {
        book = { id: 'b_' + new Date().getTime(), title: title, totalSec: 0, completed: false };
        state.books.push(book);
      }
      var minsStr = prompt('请输入补录分钟数：');
      var mins = parseInt(minsStr, 10);
      if (isNaN(mins) || mins <= 0) return alert('请输入有效的分钟数');

      var addedSec = mins * 60;
      book.totalSec += addedSec;
      state.sessions.push({
        id: 's_' + new Date().getTime(),
        bookId: book.id,
        sec: addedSec,
        time: new Date().getTime()
      });
      saveData();
      render();
      alert('补录成功！');
    }

    function getBookByTitle(title) {
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].title === title) return state.books[i];
      }
      return null;
    }

    function toggleComplete(bId) {
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === bId) {
          state.books[i].completed = !state.books[i].completed;
          break;
        }
      }
      saveData();
      render();
    }

    function deleteBook(bId) {
      if (!confirm('确定要删除这本书及其用时记录吗？')) return;
      var newBooks = [];
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id !== bId) {
          newBooks.push(state.books[i]);
        }
      }
      state.books = newBooks;
      if (state.activeId === bId) state.activeId = null;
      saveData();
      render();
    }

    function switchToKindleMode() {
      document.getElementById('kindle-ui').className = '';
      document.getElementById('pc-ui').className = 'pc-mode-container hidden';
    }

    function switchToPCMode() {
      document.getElementById('kindle-ui').className = 'hidden';
      document.getElementById('pc-ui').className = 'pc-mode-container';
    }

    function exportCSVData() {
      if (state.sessions.length === 0) return alert('暂无历史记录可导出');
      var csv = '\uFEFF阅读时间,图书名称,阅读时长(秒)\n';
      for (var i = 0; i < state.sessions.length; i++) {
        var s = state.sessions[i];
        var bTitle = '已删图书';
        for (var j = 0; j < state.books.length; j++) {
          if (state.books[j].id === s.bookId) {
            bTitle = state.books[j].title;
            break;
          }
        }
        csv += '"' + new Date(s.time).toLocaleString() + '","' + bTitle + '",' + s.sec + '\n';
      }
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'Kindle_Reading_Report.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function formatMin(secs) {
      if (!secs || secs <= 0) return '0分钟';
      var h = Math.floor(secs / 3600);
      var m = Math.floor((secs % 3600) / 60);
      if (h > 0) return h + '小时' + m + '分';
      return (m || 1) + '分钟';
    }

    function escapeStr(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
