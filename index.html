<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kindle 6寸屏极简阅读计时器</title>
  <style>
    /* ==========================================================================
       1. 6寸 Kindle 墨水屏超强兼容与高对比度样式 (ES5/E-Ink Optimized)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      line-height: 1.4;
      padding: 8px;
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      border-bottom: 3px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .clock-badge {
      border: 2px solid #000000;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: bold;
      background: #ffffff;
    }

    .card {
      border: 2px solid #000000;
      padding: 10px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .card-title {
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px dashed #000000;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    select, input[type="text"] {
      width: 100%;
      height: 48px;
      border: 2px solid #000000;
      padding: 0 10px;
      font-size: 16px;
      background: #ffffff;
      color: #000000;
      outline: none;
      border-radius: 0;
      margin-bottom: 8px;
      -webkit-appearance: none;
    }

    .btn {
      display: block;
      width: 100%;
      height: 52px;
      line-height: 48px;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
      text-decoration: none;
    }

    .btn:active, .btn.active {
      background: #000000;
      color: #ffffff;
    }

    .btn-solid {
      background: #000000;
      color: #ffffff;
    }

    .btn-solid:active {
      background: #ffffff;
      color: #000000;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-group .btn {
      flex: 1;
    }

    .timer-box {
      text-align: center;
      padding: 10px 0;
    }

    .timer-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .timer-val {
      font-size: 48px;
      font-weight: 900;
      font-family: Courier, monospace, sans-serif;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .stat-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat-card {
      flex: 1;
      border: 2px solid #000000;
      padding: 8px;
      text-align: center;
    }

    .stat-n {
      font-size: 20px;
      font-weight: 900;
    }

    .stat-l {
      font-size: 11px;
      font-weight: bold;
    }

    .book-line {
      border-bottom: 1px solid #000000;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .sm-btn {
      border: 1.5px solid #000000;
      background: #ffffff;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .sm-btn:active {
      background: #000000;
      color: #ffffff;
    }

    .hidden { display: none !important; }

    /* PC 端模式样式 */
    .pc-mode-container {
      background: #f4f6f8;
      padding: 20px;
      min-height: 100vh;
    }
    .pc-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 900px;
      margin: 0 auto 20px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       Kindle 6寸屏极简视图 (默认直接显示，保障 100% 兼容老版本 WebKit)
       ========================================================================== -->
  <div id="kindle-ui">
    <header>
      <h1>📖 Kindle 阅读计时器</h1>
      <span class="clock-badge" id="k-clock">00:00</span>
    </header>

    <!-- 图书选择卡片 -->
    <div class="card">
      <div class="card-title">① 选择当前阅读图书</div>
      <select id="k-select" onchange="onSelectChange(this.value)">
        <option value="">-- 请选择图书 --</option>
      </select>

      <div id="k-add-form" class="hidden">
        <input type="text" id="k-input-title" placeholder="输入书名，如《三体》">
        <div class="btn-group">
          <button class="btn btn-solid" onclick="doAddBook()">确认添加</button>
          <button class="btn" onclick="toggleAddForm(false)">取消</button>
        </div>
      </div>
      <button id="k-btn-show-add" class="btn" onclick="toggleAddForm(true)">➕ 添加新书</button>
    </div>

    <!-- 计时面板卡片 -->
    <div class="card">
      <div class="card-title">② 正在阅读</div>
      <div class="timer-box">
        <div class="timer-name" id="k-book-title-display">未选择图书</div>
        <div class="timer-val" id="k-timer-display">00:00:00</div>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn btn-solid" onclick="doStart()">▶ 开始阅读</button>
        <button id="btn-pause" class="btn hidden" onclick="doPause()">⏸ 暂停</button>
      </div>
      <button id="btn-finish" class="btn hidden" onclick="doFinish()" style="margin-top: 6px;">⏹ 完成并保存本次阅读</button>
    </div>

    <!-- 成就看板卡片 -->
    <div class="card">
      <div class="card-title">🏆 累计成就与单本明细</div>
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-l">总阅读时长</div>
          <div class="stat-n" id="k-stat-total">0分</div>
        </div>
        <div class="stat-card">
          <div class="stat-l">累计图书</div>
          <div class="stat-n" id="k-stat-count">0本</div>
        </div>
      </div>
      <div id="k-list-box"></div>
    </div>

    <div style="text-align: center; margin-top: 15px; font-size: 12px;">
      <a href="javascript:void(0)" onclick="switchToPCMode()" style="color: #000; text-decoration: underline;">切换至电脑大屏管理模式 ↗</a>
    </div>
  </div>

  <!-- ==========================================================================
       电脑端大屏管理视图 (PC Mode)
       ========================================================================== -->
  <div id="pc-ui" class="pc-mode-container hidden">
    <div class="pc-box">
      <h2>📊 个人阅读统计与成就大屏 (PC 管理端)</h2>
      <p style="font-size:13px; color:#666; margin-top:4px;">针对电脑大屏优化，提供详细历史修正与 CSV 导出</p>
      <div style="margin-top:15px; display:flex; gap:10px;">
        <button class="btn btn-solid" style="width:auto; padding:0 15px; height:40px; line-height:36px;" onclick="exportCSVData()">📥 导出 CSV 报表</button>
        <button class="btn" style="width:auto; padding:0 15px; height:40px; line-height:36px;" onclick="switchToKindleMode()">📱 切换回 Kindle 极简视图</button>
      </div>
    </div>

    <div class="pc-box">
      <h3>📚 单本阅读时长明细</h3>
      <div id="pc-list-box" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- ES5 纯原生 JavaScript 脚本 (100% 兼容老版本 Kindle WebKit 引擎) -->
  <script>
    var state = {
      books: [],
      sessions: [],
      activeId: null
    };

    var timer = {
      running: false,
      paused: false,
      startTime: 0,
      elapsedSec: 0,
      intervalId: null
    };

    // 页面启动入口 (纯 ES5 方式)
    window.onload = function() {
      loadData();
      startClock();
      
      // 检测 URL 是否显式要求 pc 模式
      if (window.location.href.indexOf('mode=pc') !== -1) {
        switchToPCMode();
      } else {
        switchToKindleMode();
      }
      render();
    };

    function startClock() {
      function tick() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var str = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
        var elem = document.getElementById('k-clock');
        if (elem) elem.innerHTML = str;
      }
      tick();
      setInterval(tick, 30000);
    }

    function loadData() {
      try {
        var raw = localStorage.getItem('k_reading_v3');
        if (raw) {
          state = JSON.parse(raw);
        }
      } catch(e) {}
    }

    function saveData() {
      try {
        localStorage.setItem('k_reading_v3', JSON.stringify(state));
      } catch(e) {}
    }

    function render() {
      renderSelect();
      renderStats();
    }

    function renderSelect() {
      var select = document.getElementById('k-select');
      if (!select) return;
      var html = '<option value="">-- 请选择图书 --</option>';
      for (var i = 0; i < state.books.length; i++) {
        var b = state.books[i];
        var sel = (b.id === state.activeId) ? ' selected' : '';
        html += '<option value="' + b.id + '"' + sel + '>' + (b.completed ? '✔ ' : '') + escapeStr(b.title) + ' (' + formatMin(b.totalSec) + ')</option>';
      }
      select.innerHTML = html;

      var nameDisplay = document.getElementById('k-book-title-display');
      var activeBook = getActiveBook();
      if (nameDisplay) {
        nameDisplay.innerHTML = activeBook ? '《' + escapeStr(activeBook.title) + '》' : '未选择图书';
      }
    }

    function getActiveBook() {
      if (!state.activeId) return null;
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === state.activeId) return state.books[i];
      }
      return null;
    }

    function onSelectChange(val) {
      state.activeId = val || null;
      saveData();
      render();
    }

    function toggleAddForm(show) {
      var form = document.getElementById('k-add-form');
      var btn = document.getElementById('k-btn-show-add');
      if (show) {
        form.className = '';
        btn.className = 'btn hidden';
      } else {
        form.className = 'hidden';
        btn.className = 'btn';
        document.getElementById('k-input-title').value = '';
      }
    }

    function doAddBook() {
      var input = document.getElementById('k-input-title');
      var title = input.value.replace(/^\s+|\s+$/g, '');
      if (!title) {
        alert('请输入书名');
        return;
      }
      var newBook = {
        id: 'b_' + new Date().getTime(),
        title: title,
        totalSec: 0,
        completed: false
      };
      state.books.push(newBook);
      state.activeId = newBook.id;
      saveData();
      toggleAddForm(false);
      render();
    }

    // 计时控制 (ES5 兼容)
    function doStart() {
      if (!state.activeId) {
        alert('请先选择或新建一本图书');
        return;
      }
      if (timer.running && !timer.paused) return;

      timer.running = true;
      timer.paused = false;
      timer.startTime = new Date().getTime() - (timer.elapsedSec * 1000);

      document.getElementById('btn-start').className = 'btn btn-solid hidden';
      document.getElementById('btn-pause').className = 'btn';
      document.getElementById('btn-finish').className = 'btn';

      clearInterval(timer.intervalId);
      timer.intervalId = setInterval(onTimerTick, 1000);
    }

    function doPause() {
      if (!timer.running) return;
      timer.paused = true;
      clearInterval(timer.intervalId);
      var btnStart = document.getElementById('btn-start');
      btnStart.innerHTML = '▶ 继续阅读';
      btnStart.className = 'btn btn-solid';
      document.getElementById('btn-pause').className = 'btn hidden';
    }

    function onTimerTick() {
      if (!timer.running || timer.paused) return;
      var now = new Date().getTime();
      timer.elapsedSec = Math.floor((now - timer.startTime) / 1000);
      var sec = timer.elapsedSec;
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;

      var hs = h < 10 ? '0' + h : h;
      var ms = m < 10 ? '0' + m : m;
      var ss = s < 10 ? '0' + s : s;

      document.getElementById('k-timer-display').innerHTML = hs + ':' + ms + ':' + ss;
    }

    function doFinish() {
      if (timer.elapsedSec < 5) {
        if (!confirm('阅读不足5秒，取消保存吗？')) return;
        resetTimer();
        return;
      }
      clearInterval(timer.intervalId);
      var book = getActiveBook();
      if (book) {
        book.totalSec += timer.elapsedSec;
        state.sessions.push({
          id: 's_' + new Date().getTime(),
          bookId: book.id,
          sec: timer.elapsedSec,
          time: new Date().getTime()
        });
        saveData();
      }
      alert('🎉 成功记录阅读用时 ' + formatMin(timer.elapsedSec));
      resetTimer();
      render();
    }

    function resetTimer() {
      clearInterval(timer.intervalId);
      timer.running = false;
      timer.paused = false;
      timer.elapsedSec = 0;
      document.getElementById('k-timer-display').innerHTML = '00:00:00';
      var btnStart = document.getElementById('btn-start');
      btnStart.innerHTML = '▶ 开始阅读';
      btnStart.className = 'btn btn-solid';
      document.getElementById('btn-pause').className = 'btn hidden';
      document.getElementById('btn-finish').className = 'btn hidden';
    }

    function renderStats() {
      var totalSec = 0;
      for (var i = 0; i < state.books.length; i++) {
        totalSec += (state.books[i].totalSec || 0);
      }

      document.getElementById('k-stat-total').innerHTML = formatMin(totalSec);
      document.getElementById('k-stat-count').innerHTML = state.books.length + '本';

      var kBox = document.getElementById('k-list-box');
      var pcBox = document.getElementById('pc-list-box');

      if (state.books.length === 0) {
        var emptyHtml = '<div style="font-size:12px; text-align:center; padding:8px;">暂无图书数据</div>';
        if (kBox) kBox.innerHTML = emptyHtml;
        if (pcBox) pcBox.innerHTML = emptyHtml;
        return;
      }

      var html = '';
      for (var j = 0; j < state.books.length; j++) {
        var bk = state.books[j];
        html += '<div class="book-line">' +
                  '<div>' + (bk.completed ? '✔ ' : '') + '《' + escapeStr(bk.title) + '》 (<strong>' + formatMin(bk.totalSec) + '</strong>)</div>' +
                  '<div>' +
                    '<button class="sm-btn" onclick="toggleComplete(\'' + bk.id + '\')">' + (bk.completed ? '未完' : '读完') + '</button> ' +
                    '<button class="sm-btn" onclick="deleteBook(\'' + bk.id + '\')">删</button>' +
                  '</div>' +
                '</div>';
      }
      if (kBox) kBox.innerHTML = html;
      if (pcBox) pcBox.innerHTML = html;
    }

    function toggleComplete(bId) {
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id === bId) {
          state.books[i].completed = !state.books[i].completed;
          break;
        }
      }
      saveData();
      render();
    }

    function deleteBook(bId) {
      if (!confirm('确定要删除这本书及其用时记录吗？')) return;
      var newBooks = [];
      for (var i = 0; i < state.books.length; i++) {
        if (state.books[i].id !== bId) {
          newBooks.push(state.books[i]);
        }
      }
      state.books = newBooks;
      if (state.activeId === bId) state.activeId = null;
      saveData();
      render();
    }

    function switchToKindleMode() {
      document.getElementById('kindle-ui').className = '';
      document.getElementById('pc-ui').className = 'pc-mode-container hidden';
    }

    function switchToPCMode() {
      document.getElementById('kindle-ui').className = 'hidden';
      document.getElementById('pc-ui').className = 'pc-mode-container';
    }

    function exportCSVData() {
      if (state.sessions.length === 0) return alert('暂无历史记录');
      var csv = '\uFEFF阅读时间,图书名称,阅读时长(秒)\n';
      for (var i = 0; i < state.sessions.length; i++) {
        var s = state.sessions[i];
        var bTitle = '已删图书';
        for (var j = 0; j < state.books.length; j++) {
          if (state.books[j].id === s.bookId) {
            bTitle = state.books[j].title;
            break;
          }
        }
        csv += '"' + new Date(s.time).toLocaleString() + '","' + bTitle + '",' + s.sec + '\n';
      }
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'Kindle_Reading_Report.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function formatMin(secs) {
      if (!secs || secs <= 0) return '0分钟';
      var h = Math.floor(secs / 3600);
      var m = Math.floor((secs % 3600) / 60);
      if (h > 0) return h + '小时' + m + '分';
      return (m || 1) + '分钟';
    }

    function escapeStr(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
